<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <!-- Motyw ustawiany PRZED pierwszym malowaniem strony, żeby uniknąć błysku złego motywu (FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) { /* np. localStorage zablokowane — zostajemy przy domyślnym jasnym motywie */ }
      })();
    </script>

    <!-- Google tag (gtag.js) — Consent Mode v2: domyślnie WSZYSTKO odmówione, dopóki
         użytkownik nie zaakceptuje w bannerze (src/components/CookiesConsent.tsx) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R3X89NGC74"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      gtag('js', new Date());
      gtag('config', 'G-R3X89NGC74');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Podstawowe SEO -->
    <title>Fundacja „Zapłon” – wspieramy aktywność społeczną</title>
    <meta
      name="description"
      content="Fundacja „Zapłon” wspiera aktywność społeczną, buduje kapitał społeczny i zaufanie do organizacji pozarządowych. Dołącz do naszych działań."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://zaplon.org.pl/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fundacja „Zapłon” – wspieramy aktywność społeczną" />
    <meta property="og:description" content="Dołącz do naszych działań. Wspieramy aktywność społeczną i organizacje pozarządowe." />
    <meta property="og:image" content="/images/hero.jpg" />
    <meta property="og:url" content="https://zaplon.org.pl/" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fundacja „Zapłon” – wspieramy aktywność społeczną" />
    <meta name="twitter:description" content="Wspieramy aktywność społeczną i organizacje pozarządowe." />
    <meta name="twitter:image" content="/images/hero.jpg" />

    <!-- Dane strukturalne NGO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Fundacja Zapłon",
        "url": "https://zaplon.org.pl/",
        "logo": "https://zaplon.org.pl/images/logo.svg",
        "description": "Fundacja „Zapłon” wspiera aktywność społeczną, buduje kapitał społeczny i zaufanie do organizacji pozarządowych.",
        "email": "biuro@zaplon.org.pl",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Baranówko 19B",
          "postalCode": "62-050",
          "addressLocality": "Mosina",
          "addressCountry": "PL"
        }
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Fonty: Signika i Work Sans są self-hostowane przez @font-face w src/index.css
         (public/fonts/*.woff2) — nie ładujemy ich dodatkowo z Google Fonts (to był zbędny,
         blokujący render, podwójny request i niepotrzebne przekazywanie IP użytkownika do
         Google). Sam stylesheet aplikacji Vite wstrzykuje automatycznie przy buildzie. -->
  </head>

  <body class="bg-base-100 text-text-color">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
